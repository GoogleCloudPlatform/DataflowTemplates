  # ==================================================================
  - id: dv-datatypes-googlesql
    type: datatypes
    template: v2/gcs-spanner-dv
    context: com.google.cloud.teleport.v2.templates.endtoend.BulkMigrationAndValidationMySQLAllDataTypesE2EIT
