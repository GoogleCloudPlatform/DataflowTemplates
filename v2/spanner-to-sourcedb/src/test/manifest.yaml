scenarios:
  # ==================================================================
  # Reverse Replication (v2/spanner-to-sourcedb)
  # Curated set of reference ITs to port when onboarding a new source (the source is the write
  # target here). Scenarios that only exercise source-agnostic or Spanner-platform behaviour
  # were intentionally removed.
  # ==================================================================
  - id: reverse-it
    template: v2/spanner-to-sourcedb
    context: com.google.cloud.teleport.v2.templates.SpannerToSourceDbIT
    description: "End-to-end reverse replication (insert/update/delete) over SSL into source tables, including generated and identity columns."

  - id: reverse-datatypes
    type: datatypes
    template: v2/spanner-to-sourcedb
    context: com.google.cloud.teleport.v2.templates.SpannerToMySqlDataTypesIT
    description: "Writes every Spanner data type (boundary, NULL and large LOB values) to the matching source columns and checks the values are unchanged."

  - id: reverse-datatypes-generic
    type: datatypes
    template: v2/spanner-to-sourcedb
    context: com.google.cloud.teleport.v2.templates.SpannerToSourceDbDatatypeIT
    description: "Inserts then deletes rows in source tables whose composite primary key covers every data type, and checks each row is found and deleted."

  - id: reverse-timezone
    template: v2/spanner-to-sourcedb
    context: com.google.cloud.teleport.v2.templates.SpannerToSourceDbTimezoneIT
    description: "Writes timestamps with a source time-zone offset (including across a day boundary) and checks they are shifted correctly."

  - id: reverse-reservedkeywords
    template: v2/spanner-to-sourcedb
    context: com.google.cloud.teleport.v2.templates.SpannerToMySqlReservedKeywordsIT
    description: "Writes to source tables and columns (including primary keys) named after reserved SQL keywords."

  - id: reverse-dlq-all
    template: v2/spanner-to-sourcedb
    context: com.google.cloud.teleport.v2.templates.SpannerToSourceDBMySQLRetryAllDLQIT
    description: "Sends rows that fail with constraint or transformation errors to the dead-letter queue and checks they are written after retry."

  - id: reverse-widerow-maxcolumns
    template: v2/spanner-to-sourcedb
    context: com.google.cloud.teleport.v2.templates.SpannerToMySqlSourceDbWideRowMaxColumnsIT
    description: "Writes a row to a table with the maximum number of columns (up to 1024) to check schema reading and write statements work for very wide tables."

  - id: reverse-datatypes-pg
    type: datatypes
    template: v2/spanner-to-sourcedb
    context: com.google.cloud.teleport.v2.templates.SpannerToMySqlDataTypesPGDialectIT
    spanner_dialect: POSTGRESQL
    description: "Writes every data type from a PostgreSQL-dialect Spanner database to the source and checks values are unchanged. Only if PostgreSQL-dialect Spanner is supported for the source."

  - id: reverse-interleaved-multishard
    template: v2/spanner-to-sourcedb
    context: com.google.cloud.teleport.v2.templates.SpannerToSourceDbInterleaveMultiShardIT
    description: "Replicates inserts, updates and deletes on interleaved/foreign-key tables to the correct one of two source shards. Only if the source supports sharding."
