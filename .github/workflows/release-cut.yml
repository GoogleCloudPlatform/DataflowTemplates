name: Release Cut

on:
  workflow_dispatch:
    inputs:
      candidateName:
        description: 'Name of the candidate'
        type: string
        required: true
      branchCommit:
        description: 'Commit to check out. If it is the most recent commit then leave blank.'
        type: string
        required: false
        default: ''
      cherrypickCommits:
        description: 'Comma separated commits to cherry pick'
        type: string
        required: false

permissions:
  contents: read

jobs:
  cut-release:
    name: Cut Release
    permissions:
      contents: write
    runs-on: [self-hosted, release]
    steps:
      - name: Get releaser identity
        env:
          ACTOR: ${{ github.actor }}
        run: |
          git config --global user.name "$ACTOR"
          git config --global user.email "$ACTOR@users.noreply.github.com"
      - name: Declare release branch name and tag name
        id: variables
        run: |
          echo "releaseBranchName=release_${CANDIDATE_NAME}" >> $GITHUB_OUTPUT
          echo "tagName=${CANDIDATE_NAME^^}" >> $GITHUB_OUTPUT
        env:
          CANDIDATE_NAME: ${{ inputs.candidateName }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if release branch exists
        id: check-branch
        run: |
          REMOTE_SHA=$(git ls-remote --heads origin "refs/heads/$RELEASE_BRANCH_NAME" | awk '{print $1}')
          if [ -n "$REMOTE_SHA" ]; then
            if [ -n "$BRANCH_COMMIT" ] && [ "$REMOTE_SHA" != "${BRANCH_COMMIT,,}" ]; then
              echo "ERROR: Remote branch $RELEASE_BRANCH_NAME is at $REMOTE_SHA, expected $BRANCH_COMMIT." >&2
              exit 1
            fi
            echo "branchExists=true" >> "$GITHUB_OUTPUT"
            echo "Remote branch $RELEASE_BRANCH_NAME already exists at $REMOTE_SHA; skipping release cut."
          else
            echo "branchExists=false" >> "$GITHUB_OUTPUT"
            echo "Remote branch $RELEASE_BRANCH_NAME does not exist."
          fi
        env:
          RELEASE_BRANCH_NAME: ${{ steps.variables.outputs.releaseBranchName }}
          BRANCH_COMMIT: ${{ inputs.branchCommit }}
      - name: Create release branch
        if: steps.check-branch.outputs.branchExists != 'true'
        run: git checkout -b $RELEASE_BRANCH_NAME $BRANCH_COMMIT
        env:
          RELEASE_BRANCH_NAME: ${{ steps.variables.outputs.releaseBranchName }}
          BRANCH_COMMIT: ${{ inputs.branchCommit }}
      - name: Cherry pick commits
        if: steps.check-branch.outputs.branchExists != 'true'
        run: |
          commits=$(echo $CHERRYPICK_COMMITS | tr "," "\n")
          for commit in $commits
          do
            echo "Cherry picking $commit."
            git cherry-pick $commit
          done
        env:
          CHERRYPICK_COMMITS: ${{ inputs.cherrypickCommits }}
      - name: Add tag to most recent commit
        if: steps.check-branch.outputs.branchExists != 'true'
        run: |
          DATE=$(date -d"next-monday - 1week" +'%Y-%m-%d')
          T_COMMIT=$(git log -n 1 $RELEASE_BRANCH_NAME --pretty=format:'%H')
          git tag -f -a $TAG_NAME -m "Release week of $DATE" $T_COMMIT
        env:
          RELEASE_BRANCH_NAME: ${{ steps.variables.outputs.releaseBranchName }}
          TAG_NAME: ${{ steps.variables.outputs.tagName }}
      - name: Push release branch
        if: steps.check-branch.outputs.branchExists != 'true'
        run: |
          git push origin --delete $RELEASE_BRANCH_NAME || true
          git push -u origin $RELEASE_BRANCH_NAME
        env:
          RELEASE_BRANCH_NAME: ${{ steps.variables.outputs.releaseBranchName }}
      - name: Push tags
        if: steps.check-branch.outputs.branchExists != 'true'
        run: |
          git push origin --delete $TAG_NAME || true
          git push -u origin $TAG_NAME
        env:
          TAG_NAME: ${{ steps.variables.outputs.tagName }}
