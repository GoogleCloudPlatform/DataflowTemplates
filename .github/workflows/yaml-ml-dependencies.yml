# Checks that the versions of the ML dependencies that the YAML template installs
# (python/src/main/python/yaml-template/ml_dependencies.py) follow the versions
# that apache-beam declares for the same packages. Runs on PRs that change these
# dependencies or the version of apache-beam used by the template, and every 12
# hours on the latest commit of main. Since this check does not block merging
# PRs, a scheduled run that fails opens an issue (or updates the open one), so
# that the failure is noticed.
name: YAML Template ML Dependencies

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'python/src/main/python/yaml-template/ml_dependencies.py'
      - 'python/src/main/python/yaml-template/requirements.txt'
      - 'python/src/test/python/yaml-template/check_ml_dependencies.py'
      - '.github/workflows/yaml-ml-dependencies.yml'
  schedule:
    - cron: "10 3/12 * * *" # 03:10 and 15:10 UTC, like yaml-pr.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check_ml_dependencies:
    name: Check ML Dependency Versions
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # To open an issue if a scheduled run fails.
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Uses the Python version of the template's image, since the requirements
      # of apache-beam can depend on the Python version.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      # Installs the version of apache-beam used by the template, the same way as
      # the template's Docker image (Dockerfile-template-yaml).
      - name: Install dependencies
        working-directory: python
        run: pip install --require-hashes --no-deps -r src/main/python/yaml-template/requirements.txt
      # Saves the output for the issue opened if a scheduled run fails. Unlike the
      # default shell, `bash` sets pipefail, so the step fails if the script does.
      - name: Compare ML dependency versions with apache-beam
        id: check
        working-directory: python
        shell: bash
        run: |
          PYTHONPATH=src/main/python/yaml-template python \
            src/test/python/yaml-template/check_ml_dependencies.py 2>&1 |
            tee "$RUNNER_TEMP/check_ml_dependencies.txt"
      # Runs if any step fails, so that it's also noticed if the check can't run,
      # for example because the requirements of the template can't be installed.
      - name: Open or update an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          TITLE: YAML Template ML Dependencies check failed
        run: |
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          run_url="$repo_url/actions/runs/$GITHUB_RUN_ID"
          workflow_url="$repo_url/actions/workflows/yaml-ml-dependencies.yml"
          body_file="$RUNNER_TEMP/issue_body.md"
          # shellcheck disable=SC2016 # The backticks are Markdown, not commands.
          {
            echo "A [scheduled run]($run_url) of the" \
              "[YAML Template ML Dependencies]($workflow_url) workflow failed on main."
            echo
            if [[ "$CHECK_OUTCOME" == failure ]]; then
              echo 'This usually means that the versions of the ML dependencies' \
                'that the YAML template installs' \
                '(`python/src/main/python/yaml-template/ml_dependencies.py`) no' \
                'longer follow the versions that apache-beam declares for the same' \
                'packages, for example after apache-beam was upgraded. Update' \
                '`ml_dependencies.py` as described below (and the expected values' \
                'in `ml_dependencies_test.py`).'
              echo
              echo '```'
              cat "$RUNNER_TEMP/check_ml_dependencies.txt"
              echo '```'
            else
              echo 'A step before the check failed (for example, installing the' \
                'requirements of the YAML template), so the versions were not' \
                'compared. See the logs of the run for details.'
            fi
            echo
            echo 'Close this issue once the workflow passes again.'
          } > "$body_file"

          # Updates the open issue, if any, instead of opening another one. Note
          # that `--app github-actions` instead of --author would not find it, so
          # every failed run would open a new issue.
          number=$(gh issue list --author 'github-actions[bot]' --state open \
            --limit 1000 --json number,title \
            --jq 'map(select(.title == env.TITLE))[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue edit "$number" --body-file "$body_file"
          else
            gh issue create --title "$TITLE" --body-file "$body_file"
          fi
