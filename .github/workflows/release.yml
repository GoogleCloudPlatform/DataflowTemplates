name: Release

on:
  workflow_dispatch:
    inputs:
      candidateName:
        description: 'Name of the candidate'
        type: string
        required: true
      branchCommit:
        description: 'Expected commit SHA of the release branch (optional; verified against branch HEAD if provided).'
        type: string
        required: false
        default: ''
      stageBucket:
        description: 'GCS bucket containing pre-staged release templates (at gs://<stageBucket>/<candidateName>/). Leave blank to build and stage templates locally during tests.'
        type: string
        required: false
        default: 'dataflow-templates-staging'

permissions:
  contents: read

jobs:
  release:
    name: Create Release
    permissions:
      contents: write
    runs-on: [self-hosted, release]
    env:
      IT_REGION: us-west2
    steps:
      - name: Get releaser identity
        env:
          ACTOR: ${{ github.actor }}
        run: |
          git config --global user.name "$ACTOR"
          git config --global user.email "$ACTOR@users.noreply.github.com"
      - name: Declare release branch name and tag name
        id: variables
        run: |
          echo "releaseBranchName=release_${CANDIDATE_NAME}" >> $GITHUB_OUTPUT
          echo "tagName=${CANDIDATE_NAME^^}" >> $GITHUB_OUTPUT
          if [ -n "${STAGE_BUCKET}" ]; then
            CLEAN_BUCKET="${STAGE_BUCKET#gs://}"
            CLEAN_BUCKET="${CLEAN_BUCKET%/}"
            echo "specPathPrefix=gs://${CLEAN_BUCKET}/${CANDIDATE_NAME}" >> $GITHUB_OUTPUT
          else
            echo "specPathPrefix=" >> $GITHUB_OUTPUT
          fi
        env:
          CANDIDATE_NAME: ${{ inputs.candidateName }}
          STAGE_BUCKET: ${{ inputs.stageBucket }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.variables.outputs.releaseBranchName }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add tag to most recent commit
        run: |
          DATE=$(date -d"next-monday - 1week" +'%Y-%m-%d')
          T_COMMIT=$(git log -n 1 HEAD --pretty=format:'%H')
          if [ -n "$BRANCH_COMMIT" ] && [ "$T_COMMIT" != "${BRANCH_COMMIT,,}" ]; then
            echo "ERROR: Branch $RELEASE_BRANCH_NAME is at $T_COMMIT, expected $BRANCH_COMMIT." >&2
            exit 1
          fi
          git tag -f -a "$TAG_NAME" -m "Release week of $DATE" "$T_COMMIT"
        env:
          RELEASE_BRANCH_NAME: ${{ steps.variables.outputs.releaseBranchName }}
          BRANCH_COMMIT: ${{ inputs.branchCommit }}
          TAG_NAME: ${{ steps.variables.outputs.tagName }}
      - name: Setup Environment
        id: setup-env
        uses: ./.github/actions/setup-env
      - name: Run Build
        run: ./cicd/run-build
      - name: Run Unit Tests
        run: ./cicd/run-unit-tests
      - name: Cleanup Resources
        run: ./test-infra/cleanup_resources.sh
      # TODO(https://github.com/GoogleCloudPlatform/DataflowTemplates/issues/1807) - Remove once Staging Spanner tests
      #   are fixed
      - name: Run Integration Smoke Tests
        env:
          SPEC_PATH_PREFIX: ${{ steps.variables.outputs.specPathPrefix }}
        run: |
          ./cicd/run-it-smoke-tests \
          --it-region="${IT_REGION}" \
          --it-project="cloud-teleport-testing" \
          --it-artifact-bucket="cloud-teleport-testing-it-gitactions" \
          --it-spec-path-prefix="${SPEC_PATH_PREFIX}" \
          --it-private-connectivity="datastream-connect-2" \
          --it-spanner-host="https://batch-spanner.googleapis.com" \
          --it-release=true \
          --it-retry-failures=2
      - name: Run Integration Tests With DEFAULT
        env:
          SPEC_PATH_PREFIX: ${{ steps.variables.outputs.specPathPrefix }}
        run: |
          ./cicd/run-it-tests \
          --it-region="${IT_REGION}" \
          --it-project="cloud-teleport-testing" \
          --it-artifact-bucket="cloud-teleport-testing-it-gitactions" \
          --it-spec-path-prefix="${SPEC_PATH_PREFIX}" \
          --it-private-connectivity="datastream-connect-2" \
          --it-spanner-host="https://batch-spanner.googleapis.com" \
          --it-release=true \
          --it-retry-failures=2 \
          --it-integration-test-parallelism=6 \
          --it-thread-count=6 \
          --modules-to-build="DEFAULT"
      - name: Run Integration Tests With KAFKA
        env:
          SPEC_PATH_PREFIX: ${{ steps.variables.outputs.specPathPrefix }}
        run: |
          ./cicd/run-it-tests \
          --it-region="${IT_REGION}" \
          --it-project="cloud-teleport-testing" \
          --it-artifact-bucket="cloud-teleport-testing-it-gitactions" \
          --it-spec-path-prefix="${SPEC_PATH_PREFIX}" \
          --it-private-connectivity="datastream-connect-2" \
          --it-spanner-host="https://batch-spanner.googleapis.com" \
          --it-release=true \
          --it-retry-failures=2 \
          --it-integration-test-parallelism=6 \
          --modules-to-build="KAFKA"
      - name: Run Integration Tests With BIGTABLE
        env:
          SPEC_PATH_PREFIX: ${{ steps.variables.outputs.specPathPrefix }}
        run: |
          ./cicd/run-it-tests \
          --it-region="${IT_REGION}" \
          --it-project="cloud-teleport-testing" \
          --it-artifact-bucket="cloud-teleport-testing-it-gitactions" \
          --it-spec-path-prefix="${SPEC_PATH_PREFIX}" \
          --it-private-connectivity="datastream-connect-2" \
          --it-spanner-host="https://batch-spanner.googleapis.com" \
          --it-release=true \
          --it-retry-failures=2 \
          --it-integration-test-parallelism=6 \
          --modules-to-build="BIGTABLE"
      - name: Upload Site Report
        uses: ./.github/actions/publish-site-report
        with:
          output-zip-file: test-report
        if: always()

  release-it-datastream:
    name: Create Release - IT Datastream
    needs: [release]
    runs-on: [self-hosted, release]
    steps:
      - name: Get releaser identity
        env:
          ACTOR: ${{ github.actor }}
        run: |
          git config --global user.name "$ACTOR"
          git config --global user.email "$ACTOR@users.noreply.github.com"
      - name: Declare release branch name and tag name
        id: variables
        run: |
          echo "releaseBranchName=release_${CANDIDATE_NAME}" >> $GITHUB_OUTPUT
          echo "tagName=${CANDIDATE_NAME^^}" >> $GITHUB_OUTPUT
          if [ -n "${STAGE_BUCKET}" ]; then
            CLEAN_BUCKET="${STAGE_BUCKET#gs://}"
            CLEAN_BUCKET="${CLEAN_BUCKET%/}"
            echo "specPathPrefix=gs://${CLEAN_BUCKET}/${CANDIDATE_NAME}" >> $GITHUB_OUTPUT
          else
            echo "specPathPrefix=" >> $GITHUB_OUTPUT
          fi
        env:
          CANDIDATE_NAME: ${{ inputs.candidateName }}
          STAGE_BUCKET: ${{ inputs.stageBucket }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.variables.outputs.releaseBranchName }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Environment
        id: setup-env
        uses: ./.github/actions/setup-env
      - name: Run Integration Tests
        env:
          SPEC_PATH_PREFIX: ${{ steps.variables.outputs.specPathPrefix }}
        run: |
          ./cicd/run-it-tests \
          --it-region="us-central1" \
          --it-project="cloud-teleport-testing" \
          --it-artifact-bucket="cloud-teleport-testing-it-gitactions" \
          --it-spec-path-prefix="${SPEC_PATH_PREFIX}" \
          --it-private-connectivity="datastream-connect-2" \
          --it-spanner-host="https://batch-spanner.googleapis.com" \
          --it-release=true \
          --it-retry-failures=3 \
          --modules-to-build="DATASTREAM"
      - name: Upload Site Report
        uses: ./.github/actions/publish-site-report
        with:
          output-zip-file: test-report-datastream
        if: always()

  release-it-spanner:
    name: Create Release - IT Spanner
    needs: [release-it-datastream]
    runs-on: [self-hosted, release]
    steps:
      - name: Get releaser identity
        env:
          ACTOR: ${{ github.actor }}
        run: |
          git config --global user.name "$ACTOR"
          git config --global user.email "$ACTOR@users.noreply.github.com"
      - name: Declare release branch name and tag name
        id: variables
        run: |
          echo "releaseBranchName=release_${CANDIDATE_NAME}" >> $GITHUB_OUTPUT
          echo "tagName=${CANDIDATE_NAME^^}" >> $GITHUB_OUTPUT
          if [ -n "${STAGE_BUCKET}" ]; then
            CLEAN_BUCKET="${STAGE_BUCKET#gs://}"
            CLEAN_BUCKET="${CLEAN_BUCKET%/}"
            echo "specPathPrefix=gs://${CLEAN_BUCKET}/${CANDIDATE_NAME}" >> $GITHUB_OUTPUT
          else
            echo "specPathPrefix=" >> $GITHUB_OUTPUT
          fi
        env:
          CANDIDATE_NAME: ${{ inputs.candidateName }}
          STAGE_BUCKET: ${{ inputs.stageBucket }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.variables.outputs.releaseBranchName }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Environment
        id: setup-env
        uses: ./.github/actions/setup-env
      - name: Run Integration Tests
        env:
          SPEC_PATH_PREFIX: ${{ steps.variables.outputs.specPathPrefix }}
        run: |
          ./cicd/run-it-tests \
          --it-region="us-central1" \
          --it-project="cloud-teleport-testing" \
          --it-artifact-bucket="cloud-teleport-testing-it-gitactions" \
          --it-spec-path-prefix="${SPEC_PATH_PREFIX}" \
          --it-private-connectivity="datastream-connect-2" \
          --it-spanner-host="https://batch-spanner.googleapis.com" \
          --it-release=true \
          --it-retry-failures=3 \
          --it-integration-test-parallelism=48 \
          --redirect-log-to-file='true' \
          --modules-to-build="SPANNER"
      - name: Upload Site Report
        uses: ./.github/actions/publish-site-report
        with:
          output-zip-file: test-report-spanner
        if: always()

  release-it-yaml:
    name: Create Release - IT YAML
    needs: [release-it-spanner]
    runs-on: [self-hosted, release]
    steps:
      - name: Get releaser identity
        env:
          ACTOR: ${{ github.actor }}
        run: |
          git config --global user.name "$ACTOR"
          git config --global user.email "$ACTOR@users.noreply.github.com"
      - name: Declare release branch name and tag name
        id: variables
        run: |
          echo "releaseBranchName=release_${CANDIDATE_NAME}" >> $GITHUB_OUTPUT
          echo "tagName=${CANDIDATE_NAME^^}" >> $GITHUB_OUTPUT
          if [ -n "${STAGE_BUCKET}" ]; then
            CLEAN_BUCKET="${STAGE_BUCKET#gs://}"
            CLEAN_BUCKET="${CLEAN_BUCKET%/}"
            echo "specPathPrefix=gs://${CLEAN_BUCKET}/${CANDIDATE_NAME}" >> $GITHUB_OUTPUT
          else
            echo "specPathPrefix=" >> $GITHUB_OUTPUT
          fi
        env:
          CANDIDATE_NAME: ${{ inputs.candidateName }}
          STAGE_BUCKET: ${{ inputs.stageBucket }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.variables.outputs.releaseBranchName }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Environment
        id: setup-env
        uses: ./.github/actions/setup-env
      - name: Run Integration Tests
        env:
          SPEC_PATH_PREFIX: ${{ steps.variables.outputs.specPathPrefix }}
        run: |
          ./cicd/run-it-tests \
          --it-region="us-central1" \
          --it-project="cloud-teleport-testing" \
          --it-artifact-bucket="cloud-teleport-testing-it-gitactions" \
          --it-spec-path-prefix="${SPEC_PATH_PREFIX}" \
          --it-private-connectivity="datastream-connect-2" \
          --it-spanner-host="https://batch-spanner.googleapis.com" \
          --it-release=true \
          --it-retry-failures=3 \
          --modules-to-build="YAML"
      - name: Upload Site Report
        uses: ./.github/actions/publish-site-report
        with:
          output-zip-file: test-report-yaml
        if: always()

  finalize-release:
    name: Finalize Release
    needs: [release-it-spanner]
    permissions:
      contents: write
    runs-on: [self-hosted, release]
    steps:
      - name: Get releaser identity
        env:
          ACTOR: ${{ github.actor }}
        run: |
          git config --global user.name "$ACTOR"
          git config --global user.email "$ACTOR@users.noreply.github.com"
      - name: Declare release branch name and tag name
        id: variables
        run: |
          echo "releaseBranchName=release_${CANDIDATE_NAME}" >> $GITHUB_OUTPUT
          echo "tagName=${CANDIDATE_NAME^^}" >> $GITHUB_OUTPUT
        env:
          CANDIDATE_NAME: ${{ inputs.candidateName }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.variables.outputs.releaseBranchName }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add tag to most recent commit
        run: |
          DATE=$(date -d"next-monday - 1week" +'%Y-%m-%d')
          T_COMMIT=$(git log -n 1 HEAD --pretty=format:'%H')
          git tag -f -a "$TAG_NAME" -m "Release week of $DATE" "$T_COMMIT"
        env:
          TAG_NAME: ${{ steps.variables.outputs.tagName }}
      - name: Push tags
        run: |
          git push -f origin "refs/tags/$TAG_NAME"
        env:
          TAG_NAME: ${{ steps.variables.outputs.tagName }}
      - name: Release
        run: |
          gh release delete $TAG_NAME -y || true
          gh release create $TAG_NAME --title "Dataflow Templates $TAG_NAME" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.variables.outputs.tagName }}
