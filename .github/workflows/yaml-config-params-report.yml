name: YAML Blueprint Config Params Report

on:
  schedule:
    # Run at 00:00 every Monday
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-yaml-config-params:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install beautifulsoup4 jinja2 pyyaml tabulate

      - name: Run YAML Blueprint Config Parameter Check
        id: check-params
        run: |
          python yaml/src/main/python/check_yaml_config_params.py \
            yaml/src/main/yaml \
            --markdown-output report.md \
            --github-output "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or Update Issue
        if: steps.check-params.outputs.has_mismatches == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            const issueTitle = 'YAML Blueprint Config Parameter Drift Report';
            const workflowUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/yaml-config-params-report.yml`;
            const issueBody = `${report}\n\n---\n*This report was automatically generated by the [YAML Blueprint Config Params Report](${workflowUrl}) workflow.*`;

            // Search for existing open issue to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              creator: 'app/github-actions'
            });

            const existingIssue = issues.find(i => i.title === issueTitle);

            if (existingIssue) {
              console.log(`Issue #${existingIssue.number} already exists, updating it.`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: issueBody
              });
            } else {
              console.log('Creating new issue.');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody
              });
            }
