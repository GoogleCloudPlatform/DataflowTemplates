# Checks that are intended to run on PRs containing Java code.

name: Spanner PR

on:
  pull_request:
    branches:
    - 'main'
    paths:
      # Template wide common modules
      - 'pom.xml'
      - 'v2/common/**'
      - 'v2/datastream-common/**'
      - 'it/google-cloud-platform/**'
      - 'it/conditions/**'
      # Component common modules
      - 'v2/spanner-common/**'
      - 'v2/spanner-migrations-sdk/**'
      - 'v2/spanner-custom-shard/**'
      # Include spanner paths
      - '.github/workflows/spanner-pr.yml'
      - 'v2/datastream-to-spanner/**'
      - 'v2/spanner-change-streams-to-sharded-file-sink/**'
      - 'v2/gcs-spanner-dv/**'
      - 'v2/gcs-to-sourcedb/**'
      - 'v2/sourcedb-to-spanner/**'
      - 'v2/spanner-to-sourcedb/**'
      - 'v2/gcs-spanner-dv/**'
      # Git action files
      - '.github/workflows/spanner-pr.yml'
  schedule:
  - cron: "3 */12 * * *"
  workflow_dispatch:
    inputs:
      specific_test:
        description: 'Specific Integration Test (passed to -Dtest=)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Dorg.slf4j.simpleLogger.log.org.apache.maven.plugins.shade=error

permissions:
  contents: read

jobs:
  java_build:
    name: Build
    timeout-minutes: 60
    runs-on: [self-hosted, spanner-it]
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Environment
      id: setup-env
      uses: ./.github/actions/setup-env
    - name: Run Build
      run: |
        ./cicd/run-build \
        --modules-to-build="SPANNER"
    - name: Cleanup Java Environment
      uses: ./.github/actions/cleanup-java-env
  java_integration_tests_templates:
    name: Dataflow Templates Integration Tests
    # TEMPORARY (S6 shared MySQL container trial): only Build + a few Bulk MySQL ITs.
    needs: [java_build]
    timeout-minutes: 180
    # Run on any runner that matches all the specified runs-on values.
    runs-on: [self-hosted, spanner-it]
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Environment
      id: setup-env
      uses: ./.github/actions/setup-env
    # --it-integration-test-parallelism is the Surefire threadCount per template (Maven module).
    # The live, bulk and reverse poms set perCoreThreadCount=false, so it is NOT multiplied by the
    # runner's core count, and threadCountClasses=1/threadCountMethods=1, which splits it 1:1
    # between class runners and test methods. So at most 48 / 2 = 24 ITs run concurrently per template.
    # TEMPORARY (S6 baseline): full Spanner IT run on unchanged main code (one container per
    # test), sampling CPU, RAM, disk and containers. Compared with the shared-container run in
    # PR #4470.
    - name: Run Integration Tests (baseline)
      env:
        SPECIFIC_TEST: ${{ github.event.inputs.specific_test }}
      run: |
        out="$GITHUB_WORKSPACE/s6-stats/baseline"
        mkdir -p "$out"
        test-infra/ci_resource_monitor.sh "$out" 10 &
        monitor_pid=$!
        set +e
        ./cicd/run-it-tests \
        --modules-to-build="SPANNER" \
        --it-region="us-east1" \
        --it-project="span-cloud-teleport-testing" \
        --it-artifact-bucket="span-cloud-teleport-testing-it-gitactions" \
        --it-private-connectivity="datastream-connect-2" \
        --it-cloud-proxy-host="10.128.0.16" \
        --it-integration-test-parallelism=48 \
        --redirect-log-to-file='true' \
        --it-base-container-image=":dev-image-latest" \
        --test="$SPECIFIC_TEST" 2>&1 | tee "$out/console.log"
        rc=${PIPESTATUS[0]}
        set -e
        kill "$monitor_pid" || true
        for reports in v2/*/target/surefire-reports; do
          module=$(basename "$(dirname "$(dirname "$reports")")")
          mkdir -p "$out/surefire/$module"
          cp "$reports"/TEST-*.xml "$out/surefire/$module/" 2>/dev/null || true
        done
        exit $rc
    - name: Resource usage summary
      if: always()
      run: python3 test-infra/ci_resource_summary.py "$GITHUB_WORKSPACE/s6-stats" baseline
    - name: Upload resource usage stats
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: s6-resource-stats-baseline
        path: s6-stats/
        retention-days: 10
    - name: Upload Integration Tests Report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() # always run even if the previous step fails
      with:
        name: surefire-integration-test-results
        path: |
          **/surefire-reports/TEST-*.xml
          **/surefire-reports/*.html
          **/surefire-reports/html/**
          **/surefire-reports/*-output.txt
        retention-days: 10
    - name: Integration Test report on GitHub
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
      if: always()
      with:
        name: Integration Test report on GitHub
        path: '**/surefire-reports/TEST-*.xml'
        reporter: java-junit
        only-summary: 'true'
        token: ${{ secrets.GITHUB_TOKEN }}
        fail-on-error: 'false'
        list-suites: 'failed'
        list-tests: 'failed'
    - name: Cleanup Java Environment
      uses: ./.github/actions/cleanup-java-env