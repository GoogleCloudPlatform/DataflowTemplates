options:
  - name: "maptofields_common_options"
    parameters:
      - order: 1
        name: "language"
        description: "Language used to define the expressions."
        help: >
          The language used to define (and execute) the expressions and/or 
          callables in fields. Defaults to python.
        example: "python"
        default: "python"
        required: false
        type: text
      - order: 2
        name: "fields"
        description: "Field mapping configuration"
        help: >
          The output fields to compute, each mapping to the expression or callable
          that creates them. When writing to Bigtable, the expected mutation schema
          fields are: 'key' (bytes), 'type' (string: 'SetCell', 'DeleteFromColumn',
          'DeleteFromFamily', or 'DeleteFromRow'), 'family_name' (string),
          'column_qualifier' (bytes), 'value' (bytes), and 'timestamp_micros'
          (integer, optional; defaults to -1 for current Bigtable server time).
        example: "{\"key\": {\"expression\": \"key.encode('utf-8')\", \"output_type\": \"bytes\"}, \"type\": {\"expression\": \"'SetCell'\", \"output_type\": \"string\"}, \"family_name\": {\"expression\": \"'cf1'\", \"output_type\": \"string\"}, \"column_qualifier\": {\"expression\": \"b'cq1'\", \"output_type\": \"bytes\"}, \"value\": {\"expression\": \"value.encode('utf-8')\", \"output_type\": \"bytes\"}, \"timestamp_micros\": {\"expression\": \"timestamp_micros\", \"output_type\": \"integer\"}}"
        required: true
        type: text

  - name: "maptofields_read_options"
    parameters:

  - name: "maptofields_write_options"
    parameters:

  - name: "maptofields_udf_options"
    parameters:
      - order: 1
        name: "append"
        description: "Whether to append the created fields to the set of fields already present."
        help: "Whether to append the created fields to the set of fields already present, outputting a union of both the new fields and the original fields for each record. Defaults to false."
        example: false
        required: false
        type: boolean
      - order: 2
        name: "dropFields"
        description: "List of fields from the original record to exclude when append is true."
        help: "If append is true, enumerates a subset of fields from the original record that should not be kept."
        example: '["field_to_drop_1", "field_to_drop_2"]'
        required: false
        type: text
      - order: 3
        name: "dependencies"
        description: "Extra dependencies needed for user-defined functions."
        help: "An optional list of extra dependencies that are needed for these UDFs. The interpretation of these strings is language-dependent."
        example: '["pkg1==1.0.0"]'
        required: false
        type: text
