options:
  - name: "text_read_options"
    parameters:
      - order: 1
        name: "inputPath"
        description: "Input file path"
        help: "The Cloud Storage path or file pattern to read text from."
        example: "gs://dataflow-samples/shakespeare/kinglear.txt"
        required: true
        default: "gs://dataflow-samples/shakespeare/kinglear.txt"
        type: text

  - name: "text_write_options"
    parameters:
      - order: 1
        name: "outputPath"
        description: "Output file path"
        help: "The Cloud Storage path prefix to write output text files to."
        example: "gs://your-bucket/wordcount/output"
        required: true
        type: text
