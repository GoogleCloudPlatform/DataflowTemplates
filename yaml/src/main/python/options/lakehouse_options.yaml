options:
  - name: "lakehouse_common_options"
    parameters:
      - order: 1
        name: "lakehouseTable"
        description: "A fully-qualified table identifier."
        help: "A fully-qualified table identifier, e.g., my_dataset.my_table."
        example: "my_dataset.my_table"
        required: true
        type: text
      - order: 2
        name: "lakehouseCatalogProperties"
        description: "Properties used to set up the Lakehouse catalog."
        help: "A map of properties for setting up the Lakehouse catalog."
        example: '{"type": "hadoop", "warehouse": "gs://your-bucket/warehouse"}'
        required: false
        type: text
      - order: 3
        name: "lakehouseConfigProperties"
        description: "Properties passed to the Hadoop Configuration."
        help: "A map of properties to pass to the Hadoop Configuration."
        example: '{"fs.gs.impl": "com.google.cloud.hadoop.fs.gcs.GoogleHadoopFileSystem"}'
        required: false
        type: map
      - order: 4
        name: "lakehousePartitionFields"
        description: "Fields used to create a partition spec for new tables."
        help: "A list of fields and transforms for partitioning, e.g., ['day(ts)', 'category']."
        example: '["day(ts)", "bucket(id, 4)"]'
        required: false
        type: text
      - order: 5
        name: "lakehouseTableProperties"
        description: "Lakehouse table properties to be set on table creation."
        help: "A map of Lakehouse table properties to set when the table is created."
        example: '{"commit.retry.num-retries": "2"}'
        required: false
        type: text

  - name: "lakehouse_read_options"
    parameters:
      - order: 1
        name: "lakehouseFilter"
        description: "An optional filter expression to apply to the input records."
        help: "A filter expression to apply to records from the Lakehouse table."
        example: "age > 18"
        required: false
        type: text

  - name: "lakehouse_write_options"
    parameters:
      - order: 1
        name: "lakehouseCatalogName"
        description: "Name of the catalog containing the table."
        help: "The name of the Lakehouse catalog that contains the table."
        example: "my_hadoop_catalog"
        required: true
        type: text
      - order: 2
        name: "lakehouseDrop"
        description: "A list of field names to drop from the input record before writing."
        help: "A list of field names to drop. Mutually exclusive with 'keep' and 'only'."
        example: '["field_to_drop_1", "field_to_drop_2"]'
        required: false
        type: text
      - order: 3
        name: "lakehouseKeep"
        description: "A list of field names to keep in the input record."
        help: "A list of field names to keep. Mutually exclusive with 'drop' and 'only'."
        example: '["field_to_keep_1", "field_to_keep_2"]'
        required: false
        type: text
      - order: 4
        name: "lakehouseOnly"
        description: "The name of a single record field that should be written."
        help: "The name of a single field to write. Mutually exclusive with 'keep' and 'drop'."
        example: "my_record_field"
        required: false
        type: text
      - order: 5
        name: "lakehouseDistributionMode"
        description: "Defines distribution of write data."
        help: "Defines distribution of write data. Supported distributions are 'none' (don't shuffle rows, default) and 'hash' (shuffle rows by partition key before writing data)."
        example: "none"
        required: false
        type: text
      - order: 6
        name: "lakehouseAutosharding"
        description: "Enables dynamic sharding to automatically adjust the number of parallel writers based on data volume."
        help: "If true, enables dynamic sharding to automatically adjust the number of parallel writers based on data volume. Only available with 'hash' distribution mode."
        example: false
        required: false
        type: boolean

  - name: "lakehouse_streaming_write_options"
    parameters:
      - order: 1
        name: "lakehouseTriggeringFrequencySeconds"
        description: "For a streaming pipeline, the frequency at which snapshots are produced."
        help: "The frequency in seconds for producing snapshots in a streaming pipeline."
        example: 60
        required: true
        type: integer

  - name: "lakehouse_add_files_options"
    parameters:
      - order: 1
        name: "lakehouseProjectId"
        description: "The Google Cloud project ID for the Lakehouse catalog."
        help: "The Google Cloud project ID used for the default BigLake Iceberg REST catalog when lakehouseCatalogProperties is not provided."
        example: "your-project-id"
        required: false
        type: text
