options:
  - name: "bigtable_common_options"
    parameters:
      - order: 1
        name: "projectId"
        description: "Bigtable project ID"
        help: "The Google Cloud project ID of the Bigtable instance."
        required: true
        type: text
      - order: 2
        name: "instanceId"
        description: "Bigtable instance ID"
        help: "The Bigtable instance ID."
        required: true
        type: text
      - order: 3
        name: "tableId"
        description: "Bigtable output table"
        help: "Bigtable table ID to write the output to."
        required: true
        type: text

  - name: "bigtable_read_options"
    parameters:
      - order: 1
        name: "flatten"
        description: "Bigtable flatten boolean"
        help: "If set to false, output rows are nested; if true or omitted, output rows are flattened."
        default: true
        required: false
        type: boolean

  - name: "bigtable_write_options"
    parameters:
