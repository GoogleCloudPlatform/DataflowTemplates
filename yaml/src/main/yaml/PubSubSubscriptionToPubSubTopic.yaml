template:
  name: "PubSub_Subscription_to_PubSub_Topic_Yaml"
  category: "STREAMING"
  type: "YAML"
  display_name: "Pub/Sub subscription to Pub/Sub topic (YAML)"
  description: >
    The Pub/Sub subscription to Pub/Sub topic template is a streaming pipeline that reads messages
    from a Pub/Sub subscription and writes them to another Pub/Sub topic.
  flex_container_name: "pipeline-yaml"
  yamlTemplateFile: "PubSubSubscriptionToPubSubTopic.yaml"
  filesToCopy: >
    {"main.py", "requirements.txt", "options/pubsub_options.yaml", "options/windowing_options.yaml"}
  contactInformation: "https://cloud.google.com/support"
  requirements: {
    "The input Pub/Sub subscription must exist prior to execution.",
    "The output Pub/Sub topic must exist prior to execution."
  }
  streaming: true
  hidden: false

  options_file:
    - "pubsub_options"
    - "windowing_options"

  parameters:
    - pubsub_subscription_read_options
    - pubsub_common_read_options
    - pubsub_write_options
    - windowing_common_options

pipeline:
  type: chain
  transforms:
    - type: ReadFromPubSub
      name: ReadFromPubSub
      config:
        subscription: {{ subscription }}
        format: {{ format | default('JSON') }}
        schema: {{ schema }}
        attributes: {{ attributes }}
        attributes_map: {{ attributesMap }}
        id_attribute: {{ idAttribute }}
        timestamp_attribute: {{ timestampAttribute }}
        publish_time_field: {{ publishTimeField }}
    - type: WriteToPubSub
      name: WriteToPubSub
      config:
        topic: {{ outputTopic }}
        format: {{ outputFormat | default('JSON') }}
        schema: {{ outputSchema }}
        attributes: {{ outputAttributes }}
        attributes_map: {{ outputAttributesMap }}
        id_attribute: {{ outputIdAttribute }}
        timestamp_attribute: {{ outputTimestampAttribute }}
  windowing:
    type: {{ type | default('fixed') }}
    size: {{ size | default(60) }}

options:
  streaming: true
