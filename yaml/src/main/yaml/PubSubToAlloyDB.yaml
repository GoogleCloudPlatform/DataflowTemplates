template:
  name: "PubSub_To_AlloyDB_Yaml"
  category: "STREAMING"
  type: "YAML"
  display_name: "Pub/Sub to AlloyDB (YAML)"
  description: >
    The Pub/Sub to AlloyDB template is a streaming pipeline which ingests
    data from a Pub/Sub topic and writes the resulting records to AlloyDB.
  flex_container_name: "pipeline-yaml"
  yamlTemplateFile: "PubSubToAlloyDB.yaml"
  filesToCopy: >
    {"main.py", "requirements.txt", "options/pubsub_options.yaml", "options/alloydb_options.yaml", "options/windowing_options.yaml"}
  contactInformation: "https://cloud.google.com/support"
  requirements: {
    "The input Pub/Sub topic must exist.",
    "The output AlloyDB instance and target table must exist."
  }
  streaming: true
  hidden: false

  options_file:
    - "pubsub_options"
    - "alloydb_options"
    - "windowing_options"

  parameters:
    - pubsub_topic_read_options
    - pubsub_common_read_options
    - alloydb_common_options
    - alloydb_write_options
    - windowing_common_options

pipeline:
  type: chain
  transforms:
    - type: ReadFromPubSub
      name: ReadFromPubSub
      config:
        topic: {{ topic }}
        format: {{ format | default('JSON') }}
        schema: {{ schema }}
        attributes: {{ attributes }}
        attributes_map: {{ attributesMap }}
        id_attribute: {{ idAttribute }}
        timestamp_attribute: {{ timestampAttribute }}
        publish_time_field: {{ publishTimeField }}
    - type: WriteToPostgres
      name: WriteToAlloyDB
      config:
        url: "{{ jdbcUrl }}"
        username: "{{ username }}"
        password: "{{ password }}"
        query: {{ query }}
        connection_properties: {{ connectionProperties }}
        table: {{ alloydbTable }}
        batch_size: {{ batchSize }}
        auto_sharding: {{ autoSharding }}
  windowing:
    type: {{ type | default('fixed') }}
    size: {{ size | default(60) }}

options:
  streaming: true
