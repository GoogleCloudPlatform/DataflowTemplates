template:
  name: "GCS_Text_to_BigQuery_Yaml"
  category: "BATCH"
  type: "YAML"
  display_name: "Text files on Cloud Storage to BigQuery (YAML)"
  description: >
    The Text files on Cloud Storage to BigQuery template is a batch pipeline that reads text files from Cloud Storage and writes each line to a BigQuery table.
  flex_container_name: "pipeline-yaml"
  yamlTemplateFile: "GcsTextToBigQuery.yaml"
  filesToCopy: >
    {"main.py", "requirements.txt", "options/text_options.yaml", "options/bigquery_options.yaml"}
  contactInformation: "https://cloud.google.com/support"
  requirements: {
    "The input text files must exist on Cloud Storage.",
    "The target BigQuery dataset and table must exist or be creatable."
  }
  streaming: false
  hidden: false

  options_file:
    - "text_options"
    - "bigquery_options"

  parameters:
    - text_read_options
    - bigquery_common_options
    - bigquery_write_options

pipeline:
  type: chain
  transforms:
    - type: ReadFromText
      name: ReadFromText
      config:
        path: {{ inputPath }}

    - type: WriteToBigQuery
      name: WriteToBigQuery
      config:
        table: {{ table }}
        create_disposition: {{ createDisposition | default('CREATE_NEVER') }}
        write_disposition: {{ writeDisposition | default('WRITE_APPEND') }}
        num_streams: {{ numStreams | default(1) }}

options:
  streaming: false
