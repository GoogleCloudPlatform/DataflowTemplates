template:

  name: "PubSub_Subscription_To_BigQuery_Yaml"
  category: "STREAMING"
  type: "YAML"
  display_name: "Pub/Sub subscription to BigQuery (YAML)"
  description: >
    The Pub/Sub subscription to BigQuery template is a streaming pipeline that reads JSON-formatted
    data from a Pub/Sub subscription and writes the resulting records to BigQuery.
  flex_container_name: "pipeline-yaml"
  yamlTemplateFile: "PubSubSubscriptionToBigQuery.yaml"
  filesToCopy: >
    {"main.py", "requirements.txt", "options/bigquery_options.yaml", "options/pubsub_options.yaml", "options/windowing_options.yaml"}
  documentation: >
    https://cloud.google.com/dataflow/docs/guides/templates/provided-yaml/pubsub-subscription-to-bigquery
  contactInformation: "https://cloud.google.com/support"
  requirements: {
    "The input Pub/Sub subscription must exist.",
    "The output BigQuery table must exist."
  }
  streaming: true
  hidden: false

  options_file:
    - "pubsub_options"
    - "bigquery_options"
    - "windowing_options"

  parameters:
    - pubsub_subscription_read_options
    - pubsub_common_read_options
    - bigquery_common_options
    - bigquery_write_options
    - windowing_common_options

pipeline:
  transforms:
    - type: ReadFromPubSub
      name: ReadMessages
      config:
        subscription: {{ subscription }}
        format: {{ format | default('JSON') }}
        schema: {{ schema }}
        attributes: {{ attributes }}
        attributes_map: {{ attributesMap }}
        id_attribute: {{ idAttribute }}
        timestamp_attribute: {{ timestampAttribute }}
        publish_time_field: {{ publishTimeField }}
    - type: WriteToBigQuery
      name: WriteToBigQuery
      input: ReadMessages
      config:
        table: {{ table }}
        write_disposition: {{ writeDisposition | default('WRITE_APPEND') }}
        create_disposition: {{ createDisposition | default('CREATE_NEVER') }}
        num_streams: {{ numStreams | default(1) }}
  windowing:
    type: {{ type | default('fixed') }}
    size: {{ size | default(60) }}

options:
  streaming: true
