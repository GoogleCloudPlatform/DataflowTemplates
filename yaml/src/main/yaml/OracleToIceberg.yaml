template:

  name: "Oracle_To_Iceberg_Yaml"
  category: "BATCH"
  type: "YAML"
  display_name: "Oracle to Iceberg (YAML)"
  description: >
    The Oracle to Iceberg template is a batch pipeline executes the user provided SQL query to read data from Oracle table
    and outputs the records to Iceberg table.
  flex_container_name: "pipeline-yaml"
  yamlTemplateFile: "OracleToIceberg.yaml"
  filesToCopy: >
    {"main.py", "requirements.txt", "options/oracle_options.yaml", "options/iceberg_options.yaml"}
  contactInformation: "https://cloud.google.com/support"
  requirements: {
     "The Input Oracle instance and table must exist.",
      "The Output Iceberg table need not exist, but the storage must exist and passed through catalog_properties."
   }
  streaming: false
  hidden: false

  options_file:
    - "oracle_options"
    - "iceberg_options"

  parameters:
    - oracle_common_options
    - oracle_read_options
    - iceberg_common_options
    - iceberg_write_options

pipeline:
  type: chain
  transforms:
    - type: ReadFromOracle
      name: ReadFromOracle
      config:
        url: "{{ jdbcUrl }}"
        username: "{{ username }}"
        password: "{{ password }}"
        query: {{ readQuery }}
        connection_properties: {{ connectionProperties }}
        partition_column: {{ partitionColumn }}
        table: {{ location }}
        num_partitions: {{ numPartitions }}
        fetch_size: {{ fetchSize }}
        disable_auto_commit: {{ disableAutoCommit }}
        output_parallelization: {{ outputParallelization }}

    - type: WriteToIceberg
      name: WriteToIceberg
      config:
        table: {{ table }}
        catalog_name: {{ catalogName }}
        catalog_properties: {{ catalogProperties }}
        config_properties: {{ configProperties }}
        drop: {{ drop }}
        keep: {{ keep }}
        only: {{ only }}
        partition_fields: {{ partitionFields }}
        table_properties: {{ tableProperties }}

options:
  streaming: false
