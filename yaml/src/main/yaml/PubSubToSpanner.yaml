template:

  name: "PubSub_To_Spanner_Yaml"
  category: "STREAMING"
  type: "YAML"
  display_name: "Pub/Sub to Spanner (YAML)"
  description: >
    The Pub/Sub to Spanner template is a streaming pipeline which ingests
    data from a Pub/Sub topic and writes the resulting records to
    Cloud Spanner.
  flex_container_name: "pipeline-yaml"
  yamlTemplateFile: "PubSubToSpanner.yaml"
  filesToCopy: >
    {"main.py", "requirements.txt", "options/pubsub_options.yaml", "options/spanner_options.yaml"}
  documentation: >
    https://cloud.google.com/dataflow/docs/guides/templates/provided-yaml/pubsub-to-spanner
  contactInformation: "https://cloud.google.com/support"
  requirements: {
    "The input Pub/Sub topic must exist.",
    "The output Cloud Spanner instance, database, and table must exist."
  }
  streaming: true
  hidden: false

  options_file:
    - "pubsub_options"
    - "spanner_options"
    - "windowing_options"

  parameters:
    - pubsub_topic_read_options
    - pubsub_common_options
    - pubsub_read_options
    - spanner_common_options
    - windowing_common_options

pipeline:
  type: chain
  transforms:
    - type: ReadFromPubSub
      name: ReadFromPubSub
      config:
        topic: {{ topic }}
        subscription: {{ subscription }}
        format: {{ format | default('JSON') }}
        schema: {{ schema }}
        attributes: {{ attributes }}
        attributes_map: {{ attributesMap }}
        id_attribute: {{ idAttribute }}
        timestamp_attribute: {{ timestampAttribute }}
    - type: WriteToSpanner
      name: WriteToSpanner
      config:
        project: {{ projectId }}
        instance: {{ instanceId }}
        database: {{ databaseId }}
        table: {{ tableId }}
  windowing:
    type: {{ type | default('fixed') }}
    size: {{ size | default(60) }}

options:
  streaming: true
