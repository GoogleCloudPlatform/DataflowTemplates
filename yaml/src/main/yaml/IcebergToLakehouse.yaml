template:
  name: "Iceberg_To_Lakehouse_Yaml"
  category: "BATCH"
  type: "YAML"
  display_name: "Iceberg to Lakehouse"
  description: >
    The Iceberg to Lakehouse template is a batch pipeline that reads data from an Iceberg table
    and outputs the records to a Lakehouse table.
  flex_container_name: "pipeline-yaml"
  yamlTemplateFile: "IcebergToLakehouse.yaml"
  filesToCopy: >
    {"main.py", "requirements.txt", "options/iceberg_options.yaml", "options/lakehouse_options.yaml"}
  contactInformation: "https://cloud.google.com/support"
  requirements: {
     "The Input Iceberg table must exist and be accessible through the provided catalog.",
     "The Output Lakehouse table must exist or be created, and the warehouse must be accessible."
   }
  streaming: false
  hidden: false

  options_file:
    - "iceberg_options"
    - "lakehouse_options"

  parameters:
    - iceberg_common_options
    - iceberg_read_options
    - lakehouse_common_options
    - lakehouse_write_options

pipeline:
  type: chain
  transforms:
    - type: ReadFromIceberg
      name: ReadFromIceberg
      config:
        table: {{ table }}
        catalog_name: {{ catalogName }}
        catalog_properties: {{ catalogProperties }}
        config_properties: {{ configProperties }}
        drop: {{ drop }}
        filter: {{ filter }}
        keep: {{ keep }}

    - type: WriteToLakehouse
      name: WriteToLakehouse
      config:
        table: "{{ lakehouseTable }}"
        catalog_name: "{{ lakehouseCatalogName }}"
        catalog_properties: {{ lakehouseCatalogProperties }}
        {% if lakehouseConfigProperties %}
        config_properties: {{ lakehouseConfigProperties }}
        {% endif %}
        {% if lakehouseDrop %}
        drop: {{ lakehouseDrop }}
        {% endif %}
        {% if lakehouseKeep %}
        keep: {{ lakehouseKeep }}
        {% endif %}
        {% if lakehouseOnly %}
        only: {{ lakehouseOnly }}
        {% endif %}
        {% if lakehousePartitionFields %}
        partition_fields: {{ lakehousePartitionFields }}
        {% endif %}
        {% if lakehouseTableProperties %}
        table_properties: {{ lakehouseTableProperties }}
        {% endif %}
        {% if lakehouseDistributionMode %}
        distribution_mode: "{{ lakehouseDistributionMode }}"
        {% endif %}
        {% if lakehouseAutosharding %}
        autosharding: {{ lakehouseAutosharding }}
        {% endif %}

providers:
  - include: gs://dataflow-templates/extra-python-packages/2026-08-30/yaml_provider_listing_0.3.1.yaml

options:
  streaming: false
